appId: io.bitterless.app
productName: Bitterless
directories:
  buildResources: build
  output: dist
electronLanguages:
  - zh_CN
  - zh_TW
  - ja
  - en
  - id
  - ko
  - fr
afterPack: scripts/package/desktopPackage.audit.cjs
afterSign: scripts/notarize.js
files:
  - '!src/*'
  - '!scripts/*'
  - '!tests/**'
  - '!dist/**'
  - '!tmp/**'
  - '!output/**'
  - '!out/playwright/**'
  - '!doc/*'
  - '!rig_dev/*'
  - '!rig_indies/*'
  - '!snapshots/*'
  - '!asar_unpacked/*'
  - '!local/*'
  - '!downloads/*'
  - '!external_resources/*'
  - '!external_tools/**'
  - '!prebuilt/**'
  - '!packages/micromeet-cli/**'
  - '!node_modules/@micromeet/cli{,/**}'
  - '!node_modules/**/*.map'
  - '!electron-builder.tmp.yml'
  - '!dump/*'
  - '!.vscode/*'
  - '!resources/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{postcss.config.js,theme.ts,electron.vite.spec.md}'
  - '!{package.rig.json5,env.rig.json5}'
  - '!{.qdrant-initialized,bitterless-bot.memory-card.json}'
  - '!**/*.md'
  - '!**/node-pty/prebuilds/win32*/**'
extraResources:
  - from: asar_unpacked
    to: app.asar.unpacked
  - from: skills/bitterless-todo
    to: agent-skills/bitterless-todo
  - from: skills/bitterless-preview
    to: agent-skills/bitterless-preview
  - from: skills/bitterless-trench
    to: agent-skills/bitterless-trench
  - from: build/maestro-tools
    to: maestro-tools
  - from: build/tray-mac@2x.png
    to: app.asar.unpacked/icons/tray-mac@2x.png
  - from: build/tray-win.ico
    to: app.asar.unpacked/icons/tray-win.ico
  - from: build/sounds
    to: sounds
win:
  executableName: ${name}
  icon: build/icon.ico
fileAssociations:
  - ext:
      - txt
      - md
      - markdown
      - json
      - yaml
      - yml
      - csv
      - log
      - cfg
      - conf
      - ini
      - properties
      - env
      - c
      - cc
      - cpp
      - cs
      - css
      - h
      - hpp
      - go
      - graphql
      - htm
      - html
      - java
      - js
      - cjs
      - json5
      - jsx
      - less
      - lua
      - mdx
      - mjs
      - mts
      - php
      - py
      - rb
      - rs
      - sass
      - scss
      - sh
      - sql
      - svelte
      - swift
      - toml
      - ts
      - tsx
      - vue
      - xml
      - zsh
      - pdf
      - png
      - jpg
      - jpeg
      - gif
      - webp
      - avif
      - bmp
      - ico
      - svg
      - mp3
      - wav
      - ogg
      - m4a
      - aac
      - flac
      - mp4
      - webm
      - ogv
      - mov
      - m4v
    name: Bitterless Preview Document
    description: Open with Bitterless OnlyPreview
    role: Viewer
    rank: Alternate
nsis:
  artifactName: ARTIFACT_STEM-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  perMachine: true
  include: build/installer.nsh
mac:
  icon: build/icon.icns
  binaries:
    - Contents/Resources/maestro-tools/micromeet
    - Contents/Resources/maestro-tools/bun
    - Contents/Resources/maestro-tools/rg
    - Contents/Resources/maestro-tools/fd
    - Contents/Resources/maestro-tools/anydoc/anydoc.node
    - Contents/Resources/maestro-tools/ouch
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    NSDesktopFolderUsageDescription: Application requests access to the user's Desktop folder.
    CFBundleDocumentTypes:
      - CFBundleTypeName: All Documents
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.data
dmg:
  artifactName: ARTIFACT_STEM-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
#electronDownload:
#  mirror: https://npmmirror.com/mirrors/electron/
