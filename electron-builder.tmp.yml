appId: io.bitterless.app
productName: Bitterless
directories:
  buildResources: build
  output: dist
electronLanguages:
  - zh_CN
  - zh_TW
  - ja
  - en
  - id
  - ko
  - fr
afterPack: scripts/package/desktopPackage.audit.cjs
afterSign: scripts/notarize.js
files:
  - '!src/*'
  - '!scripts/*'
  - '!tests/**'
  - '!dist/**'
  - '!tmp/**'
  - '!output/**'
  - '!out/playwright/**'
  - '!doc/*'
  - '!rig_dev/*'
  - '!rig_indies/*'
  - '!snapshots/*'
  - '!asar_unpacked/*'
  - '!local/*'
  - '!downloads/*'
  - '!external_resources/*'
  - '!external_tools/**'
  - '!prebuilt/**'
  - '!node_modules/**/*.map'
  - '!electron-builder.tmp.yml'
  - '!dump/*'
  - '!.vscode/*'
  - '!resources/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{postcss.config.js,theme.ts,electron.vite.spec.md}'
  - '!{package.rig.json5,env.rig.json5}'
  - '!bitterless-bot.memory-card.json'
  - '!**/*.md'
  # Build-time payloads that no packaged code path can reach. Every line here is asserted against
  # the BUILT artifact by scripts/package/desktopPackage.audit.cjs — see
  # docs/issues/asar-packs-the-build-toolchain.md. electron-builder.yml is GENERATED from this
  # file by scripts/before.js, so an edit to that copy is discarded at the next pack.
  #
  # App-owned junk no earlier rule covers ('!**/*.md' only drops the prose, not the assets).
  - '!**/*.tsbuildinfo'
  - '!docs/**'
  - '!out/tests/**'
  - '!skills/**'
  - '!.claude/**'
  # A git bundle of the llama.cpp sources, read only by cloneLlamaCppRepo() and the
  # `node-llama-cpp source download` CLI. Unreachable twice over in a packaged app: getLlama.js
  # defaults build to "never" under Electron, and canBuild also requires !runningInsideAsar.
  # NEVER widen this to llama/** — dist/config.js reads binariesGithubRelease.json in a top-level
  # await and getGrammarsFolder() resolves llama/grammars/.
  - '!**/node_modules/node-llama-cpp/llama/gitRelease.bundle'
  # README screenshots whose prose was already dropped by '!**/*.md'.
  - '!**/node_modules/@earendil-works/pi-coding-agent/docs/**'
  # No Node resolution path loads a declaration file; jiti strips types without them.
  # Scoped to node_modules on purpose so nothing under out/ or the app root is touched.
  - '!**/node_modules/**/*.d.ts'
  - '!**/node_modules/**/*.d.mts'
  - '!**/node_modules/**/*.d.cts'
  # C build inputs. The whole module is auto-unpacked (it carries a .node), so this is worth
  # nothing against the asar limit and 13.57 MiB against the application limit. The addon is
  # resolved by require('bindings')('better_sqlite3.node'), whose candidate table has no deps segment.
  - '!**/node_modules/better-sqlite3-multiple-ciphers/deps/**'
  - '!**/node_modules/better-sqlite3-multiple-ciphers/src/**'
  - '!**/node_modules/better-sqlite3-multiple-ciphers/binding.gyp'
  # The toolchain @kimchi-dev/kimchi-workflows drags in through its OWN dependencies
  # (typescript@^7, vitest@4). We import only its ./flow and ./engine exports; typescript and
  # vitest are reachable solely from its ./host, ./extension and ./testing exports, which no
  # source or built bundle references. A devDependency move is impossible — the worker imports
  # kimchi as a bare specifier at runtime. The '**/' prefix covers both the hoisted and the
  # nested node_modules shape, because yarn can flip that on any install.
  # esbuild is deliberately NOT here: @earendil-works/pi-coding-agent can reach it.
  #
  # lightningcss is matched as a FAMILY: it declares eleven platform-suffixed optionalDependencies
  # (lightningcss-darwin-x64, lightningcss-win32-x64-msvc, lightningcss-linux-*-gnu/musl, …) and only
  # the host's own variant installs. Naming one would leave every other build machine uncovered.
  # @rolldown and @typescript need no equivalent — they are scopes, so '@scope/**' already covers
  # their platform packages.
  - '!**/node_modules/typescript/**'
  - '!**/node_modules/@typescript/**'
  - '!**/node_modules/vite/**'
  - '!**/node_modules/vitest/**'
  - '!**/node_modules/@vitest/**'
  - '!**/node_modules/rolldown/**'
  - '!**/node_modules/@rolldown/**'
  - '!**/node_modules/lightningcss/**'
  - '!**/node_modules/lightningcss-*/**'
  - '!**/node_modules/chai/**'
  # kimchi's own ./host, ./extension and ./testing exports require the typescript and vitest that the
  # block above removes, so they are now a permanently broken import surface. Dropping them turns a
  # MODULE_NOT_FOUND that only reproduces inside a packaged build into a resolve-time absence, and
  # makes the "only /flow and /engine" contract physically true instead of merely documented.
  - '!**/node_modules/@kimchi-dev/kimchi-workflows/dist/host/**'
  - '!**/node_modules/@kimchi-dev/kimchi-workflows/dist/testing/**'
  - '!**/node_modules/@kimchi-dev/kimchi-workflows/dist/verification/**'
extraResources:
  - from: asar_unpacked
    to: app.asar.unpacked
  - from: skills/bitterless-todo
    to: agent-skills/bitterless-todo
  - from: skills/bitterless-preview
    to: agent-skills/bitterless-preview
  - from: skills/bitterless-trench
    to: agent-skills/bitterless-trench
  - from: build/maestro-tools
    to: maestro-tools
  - from: resources/zellij
    to: zellij-shell
  - from: doc/bitterless-tray-mac-22.png
    to: app.asar.unpacked/icons/bitterless-tray-mac-22.png
  - from: doc/bitterless-tray-mac-22@2x.png
    to: app.asar.unpacked/icons/bitterless-tray-mac-22@2x.png
  - from: build/tray-win.ico
    to: app.asar.unpacked/icons/tray-win.ico
  - from: build/sounds
    to: sounds
