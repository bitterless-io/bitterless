appId: io.bitterless.app
productName: Bitterless
directories:
  buildResources: build
electronLanguages:
  - zh_CN
  - zh_TW
  - ja
  - en
  - id
  - ko
  - fr
afterPack: scripts/package/desktopPackage.audit.cjs
files:
  - '!src/*'
  - '!scripts/*'
  - '!tests/**'
  - '!output/**'
  - '!doc/*'
  - '!rig_dev/*'
  - '!rig_indies/*'
  - '!snapshots/*'
  - '!asar_unpacked/*'
  - '!local/*'
  - '!downloads/*'
  - '!external_resources/*'
  - '!packages/micromeet-cli/**'
  - '!node_modules/@micromeet/cli{,/**}'
  - '!node_modules/**/*.map'
  - '!electron-builder.tmp.yml'
  - '!dump/*'
  - '!.vscode/*'
  - '!resources/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{postcss.config.js,theme.ts,electron.vite.spec.md}'
  - '!{package.rig.json5,env.rig.json5}'
  - '!{.qdrant-initialized,bitterless-bot.memory-card.json}'
  - '!**/*.md'
  - '!**/node-pty/prebuilds/win32*/**'
extraResources:
  - from: asar_unpacked
    to: app.asar.unpacked
  - from: skills/bitterless-todo
    to: agent-skills/bitterless-todo
  - from: build/maestro-tools
    to: maestro-tools
  - from: build/tray-mac@2x.png
    to: app.asar.unpacked/icons/tray-mac@2x.png
  - from: build/tray-win.ico
    to: app.asar.unpacked/icons/tray-win.ico
win:
  executableName: ${name}
nsis:
  artifactName: ${productName}VITE_ENV_PART-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  perMachine: true
  include: build/installer.nsh
mac:
  icon: build/icon.icns
  binaries:
    - Contents/Resources/maestro-tools/micromeet
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSDesktopFolderUsageDescription: Application requests access to the user's Desktop folder.
dmg:
  artifactName: ${productName}VITE_ENV_PART-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
#electronDownload:
#  mirror: https://npmmirror.com/mirrors/electron/
