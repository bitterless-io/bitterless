    name: Bitterless Preview Document
    description: Open with Bitterless OnlyPreview
    role: Viewer
    rank: Alternate
nsis:
  artifactName: ARTIFACT_STEM-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  perMachine: true
  include: build/installer.nsh
mac:
  icon: build/icon.icns
  binaries:
    - Contents/Resources/maestro-tools/bun
    - Contents/Resources/maestro-tools/rg
    - Contents/Resources/maestro-tools/fd
    - Contents/Resources/maestro-tools/anydoc/anydoc.node
    - Contents/Resources/maestro-tools/ouch
    - Contents/Resources/maestro-tools/zellij
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  extendInfo:
    # Native Finder Open With; optional viewer, never claim ownership/default status.
    # public.data also accepts ordinary unknown-extension files, not directory bundles.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Preview Documents
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.data
          - public.text
          - public.source-code
          - public.html
          - public.image
          - public.audio
          - public.movie
          - com.adobe.pdf
          - org.openxmlformats.wordprocessingml.document
          - org.openxmlformats.spreadsheetml.sheet
          - org.openxmlformats.presentationml.presentation
      - CFBundleTypeName: Office and Diagram Documents
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        CFBundleTypeExtensions:
          - doc
          - docx
          - xls
          - xlsx
          - xlsm
          - ppt
          - pptx
          - drawio
          - dio
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    NSDesktopFolderUsageDescription: Application requests access to the user's Desktop folder.
dmg:
  artifactName: ARTIFACT_STEM-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  # Build-time placeholder for the release root only. The afterPack hook rewrites the packaged
  # app-update.yml to the exact <channel>/<platform> directory, and the package audit rejects
  # any package still carrying this value.
  url: https://assets.terncloud.com/bitterless/distro
